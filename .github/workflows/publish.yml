name: Publish to npm

# Publishes @aegis-pest/mcp-kit when a `v*` tag is pushed, using npm trusted
# publishing (OIDC). No long-lived npm token is stored in this repository.
#
# One-time setup on npmjs.com (done by the package owner, once):
#   1. Create the `aegis-pest` organization (= the `@aegis-pest` scope) on
#      npmjs.com if it does not exist yet: Add Organization -> free public org.
#   2. Do the FIRST publish by hand from a clean checkout of the tagged commit,
#      because a trusted publisher can only be attached to a package that
#      already exists on the registry:
#        npm login
#        npm ci && npm run typecheck && npm run lint && npm test
#        npm publish --access public --provenance
#   3. On npmjs.com -> the package -> Settings -> Trusted Publisher -> GitHub
#      Actions: organization `Aegis-Pest`, repository `mcp-kit`, workflow
#      filename `publish.yml`, environment left blank. Save.
#   4. From then on every release is: bump `version` in package.json and add
#      the CHANGELOG entry, commit, `git tag vX.Y.Z`, `git push --follow-tags`.
#      This workflow exchanges the job's OIDC token for a short-lived publish
#      grant and the release ships with a Sigstore provenance attestation
#      (the "Provenance" badge on the package page).
#
# Trusted publishing needs npm CLI >= 11.5.1; setup-node's Node 22 image ships
# an older npm, so the workflow upgrades it explicitly.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Verify the tag is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish." >&2
            exit 1
          fi

      - name: Verify the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:pack

      # No NODE_AUTH_TOKEN: with a trusted publisher configured on npmjs.com the
      # CLI authenticates with the job's OIDC token. `prepack` rebuilds dist/.
      - run: npm publish --provenance --access public
